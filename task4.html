<!DOCTYPE html>
<html lang="en">
    <head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>   

                

<main>   
        <h1>Choose Your Plan</h1>
    <p>Simple pricing for everyone</p>
<div class="cards">
    <div class="basic">
        <h3>Basic</h3>
        <div class="price">
        <h1>$9</h1>
        <span>/mo</span>
        </div>
        <p>1 Website</p>
        <p>5 GB Storage</p>
        <p>Email Support</p>
        <button><b>Choose Plan</b></button>
        
    
    </div>
        <div class="pro">
            <h3>Pro</h3>
            <div class="price">
        <h1>$29</h1>
        <span>/mo</span>
            </div>
        <p>10 Website</p>
        <p>50 GB Storage</p>
        <p>Priority Support</p>
        <button><b>Choose Plan</b></button>
        </div>

        <div class="premium">
        <h3>Premium</h3>
        <div class="price">
        <h1>$59</h1>
        <span>/mo</span>
        </div>
        <p>Unlimited Websites</p>
        <p>500 GB Storage</p>
        <p>24/7 Support</p>
        <button><b>Choose Plan</b></button>
    </div>
</div>
</main>

</body>
</html>
