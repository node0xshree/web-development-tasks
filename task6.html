<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="task6.css">
    <title>Airwave</title>
</head>

<body>

<header>
    <nav>

        <div class="logo">
            <h2>AIRWAVE</h2>
        </div>

        <div class="icon">
            <a href="#">New</a>
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Sale</a>
        </div>

        <div class="cart">
            <button>Cart</button>
            <span>2</span>
        </div>

    </nav>
</header>


<main>

    <section class="hero-page">

        <!-- Big background text -->
        <h1>AIRWAVE</h1>


        <!-- Circles -->
        <div class="dashed"></div>
        <div class="circle"></div>


        <!-- Shoe -->
        <div class="shoe-shape">

            <div class="shoe-body">
                Product Image
            </div>

            <div class="shoe-sole"></div>

        </div>


        <!-- Discount -->
        <div class="discount">
            <h2>-30%</h2>
            <p>TODAY</p>
        </div>


        <!-- Social buttons -->
        <div class="social">
            <span>IG</span>
            <span>TW</span>
            <span>YT</span>
        </div>


        <!-- Features -->
        <div class="feature feature-one">
            <p>Air Cushion Sole</p>
            <span></span>
        </div>

        <div class="feature feature-two">
            <span></span>
            <p>Breathable Mesh</p>
        </div>

        <div class="feature feature-three">
            <p>Lightweight 240g</p>
            <span></span>
        </div>


        <!-- Right indicator -->
        <div class="side-indicator">
            <span></span>
            <i></i>
            <i></i>
            <i></i>
        </div>

    </section>


    <!-- Product Card -->
    <div class="product-card">

        <div class="product-info">
            <h2>Airwave Runner X</h2>
            <p>Men's Running Shoes</p>
        </div>


        <div class="sizes">
            <span>Size</span>

            <button>7</button>
            <button>8</button>
            <button class="selected">9</button>
            <button>10</button>
        </div>


        <div class="price">
            <h2>$139</h2>
            <del>$199</del>
        </div>


        <button class="add-cart">
            Add to Cart
        </button>

    </div>

</main>

</body>
</html>
